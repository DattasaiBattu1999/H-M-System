<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reception Desk | CarePoint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<nav class="admin-nav">
    <div class="logo" style="color:white;">
        <i class="fas fa-concierge-bell"></i> Reception Desk
    </div>
    <div class="nav-right">
        <span id="userName" style="color:white; font-weight:bold; margin-right:15px;"></span>
        <button onclick="logout()" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</nav>

<div class="container">

    <!-- ================= SEARCH ================= -->
    <div class="search-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3><i class="fas fa-search"></i> Find Patient</h3>
            <span style="font-size:0.8rem;color:var(--secondary);">
                Search by Name or Mobile
            </span>
        </div>

        <input type="text"
               id="searchInput"
               placeholder="Start typing name or mobile..."
               style="width:100%;">

        <div id="searchResults" style="margin-top:15px;"></div>
    </div>


    <!-- ================= TODAY STATS ================= -->
    <div style="margin-top:30px;">
        <h3><i class="fas fa-chart-bar"></i> Today's Overview</h3>

        <div style="display:flex;gap:20px;margin-top:15px;flex-wrap:wrap;">
            <div class="stat-card">
                <h4>Total</h4>
                <p id="totalToday">0</p>
            </div>

            <div class="stat-card">
                <h4>Waiting</h4>
                <p id="waitingCount">0</p>
            </div>

            <div class="stat-card">
                <h4>In Progress</h4>
                <p id="inProgressCount">0</p>
            </div>

            <div class="stat-card">
                <h4>Completed</h4>
                <p id="completedCount">0</p>
            </div>
        </div>
    </div>


    <!-- ================= LIVE QUEUE ================= -->
    <div style="margin-top:40px;">
        <h3><i class="fas fa-list"></i> Today's Live Queue</h3>
        <div id="liveQueue" style="margin-top:15px;"></div>
    </div>

</div>


<!-- ================= CHECK-IN MODAL ================= -->
<div id="recordModal" class="modal">
    <div class="modal-content" style="max-width:1000px;width:95%;">

        <div class="record-header" id="patientHeader"></div>

        <div class="record-body">

            <!-- LEFT: HISTORY -->
            <div class="left-panel">
                <h3><i class="fas fa-history"></i> Medical History</h3>

                <div id="historyTimeline" class="history-container">
                    <p style="text-align:center;color:#94a3b8;">
                        Select a patient to view history
                    </p>
                </div>
            </div>

            <!-- RIGHT: VITALS -->
            <div class="right-panel">
                <h3><i class="fas fa-heartbeat"></i> New Check-in</h3>

                <form id="vitalsForm">
                    <input type="hidden" id="m_patientId">

                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" id="m_weight" required>
                    </div>

                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" id="m_height" required>
                    </div>

                    <div class="form-group">
                        <label>Blood Pressure</label>
                        <input type="text" id="m_bp" placeholder="120/80" required>
                    </div>

                    <div class="form-group">
                        <label>Assign Doctor</label>
                        <select id="m_doctorId" required>
                            <option value="">Select Doctor</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus-circle"></i>
                        Add to Queue
                    </button>
                </form>
            </div>

        </div>

        <button onclick="closeModal()"
                class="btn-close-modal">
            <i class="fas fa-times"></i> Close
        </button>

    </div>
</div>


<script src="Js/auth.js"></script>
<script src="Js/reception.js"></script>

<script>
function closeModal() {
    document.getElementById('recordModal').style.display = 'none';
    document.getElementById('vitalsForm').reset();
}

window.onclick = function(event) {
    const modal = document.getElementById('recordModal');
    if (event.target === modal) closeModal();
}
</script>

</body>
</html>
