<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CarePoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="logo" style="color:white;">
            <i class="fas fa-shield-alt"></i> Admin Control Panel
        </div>
        <div class="nav-right" style="display: flex; align-items: center;">
            <span id="userName" style="color:white; font-weight:bold; margin-right:15px;"></span>
            <button onclick="logout()" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container" style="max-width: 1000px; margin: 40px auto; padding: 20px;">
        
        <div class="form-card" style="margin-bottom: 30px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom: 20px; color: #1e293b;"><i class="fas fa-user-plus"></i> Create Staff/Doctor Account</h3>
            <form id="adminCreateForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <select id="adminRole" class="modern-select" style="grid-column: span 2; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                    <option value="">Select Role</option>
                    <option value="doctor">Doctor</option>
                    <option value="staff">Receptionist/Staff</option>
                    <option value="lab">Lab Technician</option>
                </select>
                <input type="text" id="adminName" placeholder="Full Name" style="padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                <input type="email" id="adminEmail" placeholder="Email Address" style="padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                <input type="tel" id="adminMobile" placeholder="Mobile Number" style="padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                <input type="password" id="adminPass" placeholder="Temporary Password" style="padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                <button type="submit" class="btn-primary" style="grid-column: span 2; padding: 14px; font-weight: bold;">
                    <i class="fas fa-save"></i> Create Account
                </button>
            </form>
        </div>

        <div class="form-card" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #1e293b;"><i class="fas fa-users-cog"></i> Manage Users</h3>
                <button onclick="loadUserList()" class="btn-secondary" style="font-size: 0.8rem; padding: 8px 15px;">
                    <i class="fas fa-sync"></i> Refresh List
                </button>
            </div>
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f8fafc;">
                        <tr>
                            <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; color: #64748b;">Name</th>
                            <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; color: #64748b;">Role</th>
                            <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; color: #64748b;">Email</th>
                            <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; color: #64748b; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center; padding:20px; color:#94a3b8;">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="Js/auth.js"></script>
    <script src="Js/admin.js"></script>
</body>
</html>
